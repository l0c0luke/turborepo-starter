# Git hooks (https://lefthook.dev), installed by the `prepare` script.
# Agents and humans alike: never bypass these with --no-verify — fix the
# failure instead. CI runs the same checks (AGENTS.md → Quality gates).

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,md,yml,yaml,css}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      exclude:
        - ".agents/**"
        - ".claude/**"
      run: pnpm exec oxlint --type-aware --deny-warnings {staged_files}
    terraform-fmt:
      glob: "*.{tf,tfvars,tftest.hcl}"
      # CI enforces formatting either way; this just fixes it before commit.
      run: if command -v terraform >/dev/null 2>&1; then terraform fmt {staged_files}; else echo "terraform not installed — formatting is checked in CI"; fi
      stage_fixed: true

commit-msg:
  commands:
    conventional:
      run: node scripts/check-commit-msg.ts {1}

# The full local gate (lint, format, types, tests, deps, conventions, Expo
# alignment). Turbo caches most of it, so repeat pushes are fast. API tests
# need Postgres: `pnpm setup` (or `docker compose up -d`) first.
pre-push:
  commands:
    check:
      run: pnpm check
