name: CI

# Every job runs the same `pnpm` scripts you run locally — `pnpm check` is the
# local mirror of the static, typecheck and test jobs. See AGENTS.md →
# "Quality gates". `ci-ok` is the single required status for merging.

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

# Least privilege: jobs only need to read the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3
  # Turbo Remote Caching (optional): https://turborepo.com/docs/core-concepts/remote-caching
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  static:
    name: static (lint, deps, conventions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./tooling/github/setup
      - run: cp .env.example .env

      - name: Lint (oxlint, type-aware, warnings are errors)
        run: pnpm lint
      - name: Workspace lint (sherif)
        run: pnpm lint:ws
      - name: Format (prettier)
        run: pnpm format
      - name: Unused files & dependencies (knip)
        run: pnpm check:deps
      - name: Peer dependencies
        run: pnpm check:peers
      - name: Repo conventions (AGENTS.md rules, skills, testing & UX policy)
        run: pnpm check:conventions
      - name: Expo SDK alignment
        run: pnpm check:expo

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./tooling/github/setup
      - run: pnpm typecheck

  test:
    name: test (+ migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same image, credentials and port as docker-compose.yml / .env.example.
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: example
          POSTGRES_PASSWORD: example
          POSTGRES_DB: example
        ports:
          - 5832:5432
        options: >-
          --health-cmd "pg_isready -U example -d example"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./tooling/github/setup
      - run: cp .env.example .env

      - name: Migrations apply cleanly to an empty database
        run: pnpm db:migrate
      - name: Migrations are in sync with the schema
        shell: bash
        run: |
          pnpm db:generate --name ci-drift-check
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::packages/db/src schema changed without a migration. Run \`pnpm db:generate\` and commit packages/db/drizzle/."
            git status --porcelain packages/db/drizzle
            exit 1
          fi
      - name: Tests (with coverage thresholds)
        run: pnpm test

  build:
    name: build (+ bundle budget)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Real env vars are provided at runtime, not in CI.
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./tooling/github/setup
      - run: cp .env.example .env
      - run: pnpm build
      - name: Bundle budget (apps/nextjs/bundle-budget.json)
        run: pnpm check:bundle

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build apps/nextjs/Dockerfile (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/nextjs/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./tooling/github/setup
      - name: No high/critical advisories (pnpm audit)
        run: pnpm check:audit

  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned release + checksum (from the release's checksums.txt). Uses the
      # MIT-licensed CLI directly: gitleaks-action needs a licence key for
      # repos owned by an organisation.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan git history
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .

  infra:
    name: infra (terraform)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned releases (+ checksum for trivy, installed directly rather than
      # via trivy-action, whose tags were hijacked in 2026). Bump together.
      TFLINT_VERSION: "v0.66.0"
      TRIVY_VERSION: "0.76.2"
      TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
    steps:
      - uses: actions/checkout@v7
      - name: Detect Terraform under infra/
        id: tf
        shell: bash
        run: |
          # Git pathspec `*` matches `/` too: this finds infra/envs/*/*.tf etc.
          if git ls-files -- 'infra/*.tf' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "version=$(tr -d '[:space:]' < infra/.terraform-version)" >> "$GITHUB_OUTPUT"
          else
            echo "No Terraform under infra/ — nothing to check (AGENTS.md → Infrastructure)."
          fi

      - if: steps.tf.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - if: steps.tf.outputs.present == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - if: steps.tf.outputs.present == 'true'
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - if: steps.tf.outputs.present == 'true'
        name: Install trivy
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - if: steps.tf.outputs.present == 'true'
        name: fmt, validate, test, tflint, trivy (scripts/check-infra.ts)
        run: node scripts/check-infra.ts

  # Single required check for branch protection / rulesets / merge queues.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [static, typecheck, test, build, docker, audit, secret-scan, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        shell: bash
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")' > /dev/null \
            || { echo "::error::One or more CI jobs did not succeed."; exit 1; }
