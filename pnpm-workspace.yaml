packages:
  - apps/*
  - packages/*
  - tooling/*

autoInstallPeers: false

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  lefthook: true
  sharp: true

overrides:
  postcss: ^8.5.30
  # Keep a single esbuild across the tree; mixed versions break its
  # postinstall binary check (drizzle-kit still pulls the legacy @esbuild-kit).
  esbuild: ^0.28.2

catalog:
  # --- Auth ---
  "@better-auth/expo": ^1.7.7
  better-auth: ^1.7.7

  # --- API ---
  "@trpc/client": ^11.19.0
  "@trpc/server": ^11.19.0
  "@trpc/tanstack-react-query": ^11.19.0
  "@tanstack/react-query": ^5.104.2
  superjson: ^2.2.6
  expo-server-sdk: ^7.2.0

  # --- Database ---
  drizzle-cuid2: ^2.2.0
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  drizzle-zod: ^0.8.3
  postgres: ^3.4.9

  # --- Email ---
  react-email: ^6.11.1
  nodemailer: ^10.1.0

  # --- Validation ---
  zod: ^4.6.7

  # --- Testing ---
  vitest: ^5.0.4
  vite: ^8.3.4

  # --- React / React Native (Expo SDK 57 aligned) ---
  # NOTE: these are pinned to Expo SDK 57 / React Native 0.86 requirements.
  # Do not bump independently — run `expo install --fix` after changing the Expo SDK.
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-gesture-handler: ~2.32.0
  react-native-reanimated: 4.5.1
  react-native-safe-area-context: ~5.7.0
  react-native-screens: ~4.26.2
  react-native-worklets: 0.10.1

  # --- Expo SDK 57 ---
  expo: ~57.0.28
  expo-apple-authentication: ~57.0.2
  expo-constants: ~57.0.21
  expo-crypto: ~57.0.4
  expo-dev-client: ~57.0.20
  expo-font: ~57.0.4
  expo-linking: ~57.0.12
  expo-location: ~57.0.21
  expo-router: ~57.0.26
  expo-secure-store: ~57.0.4
  expo-splash-screen: ~57.0.10
  expo-status-bar: ~57.0.1
  expo-system-ui: ~57.0.4
  expo-web-browser: ~57.0.3
  "@expo/dom-webview": ~57.0.1
  "@expo/metro-runtime": ~57.0.16
  "@expo/vector-icons": ^15.1.1
  "@react-native-community/datetimepicker": 9.1.0
  "@react-native-community/slider": 5.2.1
  "@react-native-google-signin/google-signin": ^16.1.5

  # --- Next.js ---
  next: ^16.4.0
  next-intl: ^4.14.9
  next-themes: ^0.4.6
  "@next/bundle-analyzer": ^16.4.0
  "@next/third-parties": ^16.4.0
  "@t3-oss/env-nextjs": ^0.13.11

  # --- SEO ---
  schema-dts: ^2.1.0

  # --- Observability (Sentry) ---
  "@sentry/nextjs": ^11.7.0
  "@sentry/react-native": ~7.11.0

  # --- Tailwind / Styling ---
  # Both apps use Tailwind 4. The Expo app uses NativeWind 5 (preview), which is
  # built on Tailwind 4 + @tailwindcss/postcss and the react-native-css engine.
  tailwindcss: ^4.3.3
  nativewind: 5.0.0-rc.0
  react-native-css: ^3.0.7
  "@tailwindcss/postcss": ^4.3.3
  postcss: ^8.5.30
  tailwind-merge: ^3.7.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1

  # --- shadcn/ui (Radix) ---
  "@radix-ui/react-accordion": ^1.3.1
  "@radix-ui/react-alert-dialog": ^1.2.1
  "@radix-ui/react-avatar": ^1.3.1
  "@radix-ui/react-checkbox": ^1.4.1
  "@radix-ui/react-dropdown-menu": ^2.2.1
  "@radix-ui/react-label": ^2.1.17
  "@radix-ui/react-navigation-menu": ^1.4.1
  "@radix-ui/react-popover": ^1.3.1
  "@radix-ui/react-radio-group": ^1.5.1
  "@radix-ui/react-select": ^2.4.1
  "@radix-ui/react-separator": ^1.2.0
  "@radix-ui/react-slot": ^1.5.0
  "@radix-ui/react-switch": ^1.4.1
  "@radix-ui/react-tabs": ^1.2.1
  "@radix-ui/react-toggle": ^1.2.1
  "@radix-ui/react-toggle-group": ^1.2.1
  "@radix-ui/react-tooltip": ^1.4.1

  # --- Forms ---
  "@hookform/resolvers": ^5.9.1
  react-hook-form: ^7.90.0
  react-day-picker: ^10.0.2
  cmdk: ^1.1.1
  sonner: ^2.0.8

  # --- Date utilities ---
  date-fns: ^4.4.0
  date-fns-tz: ^3.2.0
  cronstrue: ^3.32.0

  # --- Icons ---
  lucide-react: ^1.56.0

  # --- Tooling ---
  # oxlint (Rust) replaces ESLint + typescript-eslint. Type-aware rules run via
  # oxlint-tsgolint, which has no TypeScript version cap — this is what lets the
  # repo run TypeScript 7.
  oxlint: ^1.88.0
  oxlint-tsgolint: ^7.0.2004
  prettier: ^3.9.10
  typescript: ^7.0.2
  turbo: ^2.11.8
  "@turbo/gen": ^2.11.8
  dotenv-cli: ^11.0.0
  lefthook: ^2.2.2
  minimatch: ^10.2.6
  tsx: ^4.23.15
  jiti: ^2.7.0

  # --- Prettier plugins ---
  "@ianvs/prettier-plugin-sort-imports": ^4.7.1
  prettier-plugin-tailwindcss: ^0.8.1

  # --- Type definitions ---
  # NOTE: @types/node stays on 22.x to match the Node 22 runtime (not 26.x).
  "@types/node": ^22.20.5
  "@types/nodemailer": ^8.0.2
  "@types/pg": ^8.23.1
  "@types/jsonwebtoken": ^9.0.10
  "@types/better-sqlite3": ^9.6.0
  "@types/estree": ^1.0.9
  "@types/json-schema": ^7.0.15
  "@types/babel__core": ^7.20.5

  # --- Babel (Expo) ---
  # NOTE: stays on Babel 7.x — Expo SDK 57 / Metro / babel-preset-expo require it.
  "@babel/core": ^7.29.7
  "@babel/preset-env": ^7.29.7
  "@babel/runtime": ^7.29.10

  # --- Dev utilities ---
  tw-animate-css: ^1.4.0

catalogs:
  react19:
    "@types/react": ^19.2.18
    "@types/react-dom": ^19.2.7

nodeLinker: hoisted

