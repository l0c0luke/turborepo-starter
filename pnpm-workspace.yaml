packages:
  - apps/*
  - packages/*
  - tooling/*

autoInstallPeers: false

# Peer issues fail CI (`pnpm check:peers`). Only list a peer here with a reason.
peerDependencyRules:
  ignoreMissing:
    # react-native-worklets asks for it; Expo apps bundle with
    # @expo/metro-config instead, which Expo supplies.
    - "@react-native/metro-config"

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  lefthook: true
  sharp: true

overrides:
  postcss: ^8.5.32
  # Keep a single esbuild across the tree; mixed versions break its
  # postinstall binary check (drizzle-kit still pulls the legacy @esbuild-kit).
  esbuild: ^0.28.2
  # Keep a single @types/node across the tree. Without this, tools such as
  # @turbo/gen pull a newer @types/node, and (with autoInstallPeers: false +
  # the hoisted linker) `next` gets installed as two peer variants — one at the
  # root, one under apps/nextjs — whose NextConfig types don't match, failing
  # `pnpm typecheck` on apps/nextjs/next.config.js. Tracks the catalog version.
  "@types/node": "catalog:"
  # NativeWind v5 (react-native-css) serialises its CSS AST with lightningcss;
  # newer lightningcss releases change that format and the Expo bundle fails
  # with "failed to deserialize ... Specifier". Pinned per the NativeWind v5
  # install guide — revisit when NativeWind 5 goes stable.
  lightningcss: 1.30.1
  # Security floors for transitive deps go here when `pnpm check:audit` flags
  # one that upstream hasn't fixed yet. Scope each to the vulnerable range
  # ("pkg@<1.2.3": ^1.2.3) so nothing else moves, and delete it once a fresh
  # resolve (rm pnpm-lock.yaml && pnpm install --lockfile-only) audits clean.

catalog:
  # --- Auth ---
  "@better-auth/expo": ^1.7.22
  better-auth: ^1.7.22
  # Better Auth CLI (`pnpm auth:generate`) — keep on the same version as better-auth.
  auth: ^1.7.22

  # --- API ---
  "@trpc/client": ^11.28.0
  "@trpc/server": ^11.28.0
  "@trpc/tanstack-react-query": ^11.28.0
  "@tanstack/react-query": ^5.107.1
  superjson: ^2.2.6

  # --- Database ---
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  # Held on 3.x: postgres 4 rewrites the driver and lets the server pick
  # parameter types (Date/boolean/bigint handling changes). Move when
  # drizzle-orm supports it — Renovate opens that PR on its own.
  postgres: ^3.4.9

  # --- Email ---
  react-email: ^6.11.12
  nodemailer: ^10.5.0

  # --- Validation ---
  zod: ^4.6.7

  # --- Testing ---
  vitest: ^5.1.0
  # Keep in lockstep with vitest (exact peer).
  "@vitest/coverage-v8": ^5.1.0
  vite: ^8.3.8

  # --- React / React Native (Expo SDK 58 aligned) ---
  # NOTE: these are pinned to Expo SDK 58 / React Native 0.88 requirements.
  # Do not bump independently — after changing the Expo SDK run
  # `pnpm -F @example-app/expo exec expo install --fix`. CI (`pnpm check:expo`)
  # fails when these drift from what the SDK expects.
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.1
  react-native-gesture-handler: ~3.3.0
  react-native-reanimated: 4.7.1
  react-native-safe-area-context: ~5.11.1
  react-native-screens: ~4.30.1
  react-native-worklets: 0.13.0

  # --- Expo SDK 58 ---
  expo: ~58.0.25
  expo-apple-authentication: ~58.0.3
  expo-constants: ~58.0.16
  expo-crypto: ~58.0.8
  expo-dev-client: ~58.0.20
  expo-font: ~58.0.12
  expo-linking: ~58.0.17
  expo-router: ~58.0.31
  expo-secure-store: ~58.0.3
  expo-splash-screen: ~58.0.14
  expo-status-bar: ~58.0.5
  expo-system-ui: ~58.0.7
  expo-web-browser: ~58.0.8
  "@expo/dom-webview": ~58.0.2
  "@expo/metro-runtime": ~58.0.17
  "@expo/vector-icons": ^15.1.1
  # Used by apps/expo/babel.config.js. Expo depends on it too — keep the range
  # on the same patch line as `expo` so one copy is installed.
  babel-preset-expo: ~58.0.25
  "@react-native-community/datetimepicker": 9.2.1
  "@react-native-google-signin/google-signin": ^17.0.0

  # --- Next.js ---
  next: ^16.4.6
  next-intl: ^4.15.1
  next-themes: ^0.4.6
  "@next/third-parties": ^16.4.6
  "@t3-oss/env-nextjs": ^0.13.11

  # --- SEO ---
  schema-dts: ^2.1.0

  # --- Observability (Sentry) ---
  "@sentry/nextjs": ^11.12.0
  "@sentry/react-native": ~8.28.0

  # --- Tailwind / Styling ---
  # Both apps use Tailwind 4. The Expo app uses NativeWind 5 (preview), which is
  # built on Tailwind 4 + @tailwindcss/postcss and the react-native-css engine.
  tailwindcss: ^4.3.5
  nativewind: 5.0.0-rc.1
  react-native-css: 3.1.0-rc.1
  "@tailwindcss/postcss": ^4.3.5
  postcss: ^8.5.32
  tailwind-merge: ^3.7.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1

  # --- shadcn/ui (Radix) ---
  "@radix-ui/react-accordion": ^1.3.1
  "@radix-ui/react-alert-dialog": ^1.2.1
  "@radix-ui/react-avatar": ^1.3.1
  "@radix-ui/react-checkbox": ^1.4.1
  "@radix-ui/react-dialog": ^1.3.1
  "@radix-ui/react-dropdown-menu": ^2.2.1
  "@radix-ui/react-label": ^2.1.17
  "@radix-ui/react-navigation-menu": ^1.4.1
  "@radix-ui/react-popover": ^1.3.1
  "@radix-ui/react-radio-group": ^1.5.1
  "@radix-ui/react-select": ^2.4.1
  "@radix-ui/react-separator": ^1.2.0
  "@radix-ui/react-slot": ^1.5.0
  "@radix-ui/react-switch": ^1.4.1
  "@radix-ui/react-tabs": ^1.2.1
  "@radix-ui/react-toggle": ^1.2.1
  "@radix-ui/react-toggle-group": ^1.2.1
  "@radix-ui/react-tooltip": ^1.4.1

  # --- Forms ---
  "@hookform/resolvers": ^7.0.6
  react-hook-form: ^7.92.0
  react-day-picker: ^10.0.2
  cmdk: ^1.1.1
  sonner: ^2.0.8

  # --- Date utilities ---
  date-fns: ^4.4.0

  # --- Icons ---
  lucide-react: ^1.72.0

  # --- Tooling ---
  # oxlint (Rust) replaces ESLint + typescript-eslint. Type-aware rules run via
  # oxlint-tsgolint, which has no TypeScript version cap — this is what lets the
  # repo run TypeScript 7.
  oxlint: ^1.93.0
  oxlint-tsgolint: ^7.0.2007
  prettier: ^3.10.1
  # Workspace/monorepo linter (`pnpm lint:ws`; runs in CI). Pinned exactly so
  # local runs and CI agree; Renovate bumps it.
  sherif: 1.13.0
  # Unused files/dependencies/exports (`pnpm check:deps`; runs in CI).
  knip: 6.45.1
  # Agent skills CLI (`pnpm skills:install` / `pnpm skills:update`; skills-lock.json).
  skills: 1.8.1
  typescript: ^7.0.2
  turbo: ^2.11.11
  "@turbo/gen": ^2.11.11
  dotenv-cli: ^11.1.0
  lefthook: ^2.2.2
  tsx: ^4.23.15
  # Marker import that fails the build if server code reaches a client bundle.
  server-only: ^0.0.1
  jiti: ^2.7.0

  # --- Prettier plugins ---
  "@ianvs/prettier-plugin-sort-imports": ^4.7.1
  prettier-plugin-tailwindcss: ^0.8.1

  # --- Type definitions ---
  # NOTE: @types/node tracks the Node 24 LTS runtime (.nvmrc / engines /
  # Dockerfile / eas.json) — bump it together with those, not to the latest major.
  "@types/node": ^24.19.2
  "@types/nodemailer": ^8.0.2
  "@types/babel__core": ^7.20.5

  # --- Babel (Expo) ---
  # NOTE: stays on Babel 7.x — Expo SDK 58 / Metro / babel-preset-expo require it.
  "@babel/core": ^7.29.13

  # --- Dev utilities ---
  tw-animate-css: ^1.4.0

catalogs:
  react19:
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0

nodeLinker: hoisted
