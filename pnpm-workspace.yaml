packages:
  - apps/*
  - packages/*
  - tooling/*

autoInstallPeers: false

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  lefthook: true
  sharp: true

overrides:
  postcss: ^8.5.15
  "@esbuild-kit/core-utils>esbuild": 0.25.12

catalog:
  # --- Auth ---
  "@better-auth/expo": ^1.6.20
  better-auth: ^1.6.20

  # --- API ---
  "@trpc/client": ^11.18.0
  "@trpc/server": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  "@tanstack/react-query": ^5.101.1
  superjson: ^2.2.6
  expo-server-sdk: ^6.1.0

  # --- Database ---
  drizzle-cuid2: ^2.2.0
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  drizzle-zod: ^0.8.3
  postgres: ^3.4.9

  # --- Email ---
  react-email: ^6.6.4
  nodemailer: ^9.0.1

  # --- Validation ---
  zod: ^4.4.3

  # --- Testing ---
  vitest: ^4.1.9

  # --- React / React Native (Expo SDK 55 aligned) ---
  # NOTE: these are pinned to Expo SDK 55 / React Native 0.83 requirements.
  # Do not bump independently — run `expo install --fix` after changing the Expo SDK.
  react: 19.2.0
  react-dom: 19.2.0
  react-native: 0.83.6
  react-native-gesture-handler: ~2.30.0
  react-native-reanimated: 4.2.1
  react-native-safe-area-context: ~5.6.2
  react-native-screens: ~4.23.0
  react-native-worklets: 0.7.4

  # --- Expo SDK 55 ---
  expo: ~55.0.23
  expo-apple-authentication: ~55.0.13
  expo-constants: ~55.0.16
  expo-crypto: ~55.0.14
  expo-dev-client: ~55.0.32
  expo-font: ~55.0.7
  expo-linking: ~55.0.15
  expo-location: ~55.1.9
  expo-router: ~55.0.14
  expo-secure-store: ~55.0.13
  expo-splash-screen: ~55.0.20
  expo-status-bar: ~55.0.6
  expo-system-ui: ~55.0.17
  expo-web-browser: ~55.0.15
  "@expo/dom-webview": 55.0.6
  "@expo/metro-runtime": ~55.0.11
  "@expo/vector-icons": ^15.1.1
  "@react-native-community/datetimepicker": 8.6.0
  "@react-native-community/slider": 5.1.2
  "@react-native-google-signin/google-signin": ^16.1.2

  # --- Next.js ---
  next: ^16.2.9
  next-intl: ^4.13.0
  next-themes: ^0.4.6
  "@next/bundle-analyzer": ^16.2.9
  "@next/third-parties": ^16.2.9
  "@t3-oss/env-nextjs": ^0.13.11

  # --- SEO ---
  schema-dts: ^2.0.0

  # --- Observability (Sentry) ---
  "@sentry/nextjs": ^10.60.0
  "@sentry/react-native": ^8.14.1

  # --- Tailwind / Styling ---
  # Both apps use Tailwind 4. The Expo app uses NativeWind 5 (preview), which is
  # built on Tailwind 4 + @tailwindcss/postcss and the react-native-css engine.
  tailwindcss: ^4.3.1
  nativewind: 5.0.0-preview.4
  react-native-css: ^3.0.6
  "@tailwindcss/postcss": ^4.3.1
  postcss: ^8.5.15
  tailwind-merge: ^3.6.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1

  # --- shadcn/ui (Radix) ---
  "@radix-ui/react-accordion": ^1.2.14
  "@radix-ui/react-alert-dialog": ^1.1.17
  "@radix-ui/react-avatar": ^1.2.0
  "@radix-ui/react-checkbox": ^1.3.5
  "@radix-ui/react-dropdown-menu": ^2.1.18
  "@radix-ui/react-label": ^2.1.10
  "@radix-ui/react-navigation-menu": ^1.2.16
  "@radix-ui/react-popover": ^1.1.17
  "@radix-ui/react-radio-group": ^1.4.1
  "@radix-ui/react-select": ^2.3.1
  "@radix-ui/react-separator": ^1.1.10
  "@radix-ui/react-slot": ^1.3.0
  "@radix-ui/react-switch": ^1.3.1
  "@radix-ui/react-tabs": ^1.1.15
  "@radix-ui/react-toggle": ^1.1.12
  "@radix-ui/react-toggle-group": ^1.1.13
  "@radix-ui/react-tooltip": ^1.2.10

  # --- Forms ---
  "@hookform/resolvers": ^5.4.0
  react-hook-form: ^7.80.0
  react-day-picker: ^10.0.1
  cmdk: ^1.1.1
  sonner: ^2.0.7

  # --- Date utilities ---
  date-fns: ^4.4.0
  date-fns-tz: ^3.2.0
  cronstrue: ^3.21.0

  # --- Icons ---
  lucide-react: ^1.21.0

  # --- Tooling ---
  # NOTE: eslint stays on 9.x and typescript on 5.9.x — typescript-eslint 8.x does
  # not yet support ESLint 10 / TS 6.0. Bump together when the ecosystem catches up.
  eslint: ^9.39.4
  prettier: ^3.8.4
  typescript: ^5.9.3
  turbo: ^2.9.18
  "@turbo/gen": ^2.9.18
  dotenv-cli: ^11.0.0
  lefthook: ^2.1.9
  minimatch: ^10.2.5
  tsx: ^4.22.4
  jiti: ^2.7.0

  # --- ESLint plugins ---
  "@eslint/compat": ^2.1.0
  "@next/eslint-plugin-next": ^16.2.9
  eslint-plugin-import: ^2.32.0
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-react: ^7.37.5
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-turbo: ^2.9.18
  typescript-eslint: ^8.62.0

  # --- Prettier plugins ---
  "@ianvs/prettier-plugin-sort-imports": ^4.7.1
  prettier-plugin-tailwindcss: ^0.8.0

  # --- Type definitions ---
  # NOTE: @types/node stays on 22.x to match the Node 22 runtime (not 26.x).
  "@types/node": ^22.20.0
  "@types/nodemailer": ^8.0.1
  "@types/pg": ^8.20.0
  "@types/jsonwebtoken": ^9.0.10
  "@types/better-sqlite3": ^7.6.13
  "@types/estree": ^1.0.9
  "@types/json-schema": ^7.0.15
  "@types/babel__core": ^7.20.5

  # --- Babel (Expo) ---
  # NOTE: stays on Babel 7.x — Expo SDK 55 / Metro / babel-preset-expo require it.
  "@babel/core": ^7.29.0
  "@babel/preset-env": ^7.29.5
  "@babel/runtime": ^7.29.2

  # --- Dev utilities ---
  tw-animate-css: ^1.4.0

catalogs:
  react19:
    "@types/react": ^19.2.17
    "@types/react-dom": ^19.2.3

nodeLinker: hoisted
