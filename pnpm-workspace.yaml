packages:
  - apps/*
  - packages/*
  - tooling/*

autoInstallPeers: false

allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  lefthook: true
  sharp: true

overrides:
  postcss: ^8.5.25
  # Keep a single esbuild across the tree; mixed versions break its
  # postinstall binary check (drizzle-kit still pulls the legacy @esbuild-kit).
  esbuild: ^0.28.1

catalog:
  # --- Auth ---
  "@better-auth/expo": ^1.6.25
  better-auth: ^1.6.25

  # --- API ---
  "@trpc/client": ^11.18.0
  "@trpc/server": ^11.18.0
  "@trpc/tanstack-react-query": ^11.18.0
  "@tanstack/react-query": ^5.101.4
  superjson: ^2.2.6
  expo-server-sdk: ^7.0.0

  # --- Database ---
  drizzle-cuid2: ^2.2.0
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  drizzle-zod: ^0.8.3
  postgres: ^3.4.9

  # --- Email ---
  react-email: ^6.9.1
  nodemailer: ^9.0.3

  # --- Validation ---
  zod: ^4.4.3

  # --- Testing ---
  vitest: ^4.1.9

  # --- React / React Native (Expo SDK 57 aligned) ---
  # NOTE: these are pinned to Expo SDK 57 / React Native 0.86 requirements.
  # Do not bump independently — run `expo install --fix` after changing the Expo SDK.
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.2
  react-native-gesture-handler: ~2.32.0
  react-native-reanimated: 4.5.1
  react-native-safe-area-context: ~5.7.0
  react-native-screens: ~4.26.2
  react-native-worklets: 0.10.1

  # --- Expo SDK 57 ---
  expo: ~57.0.10
  expo-apple-authentication: ~57.0.1
  expo-constants: ~57.0.9
  expo-crypto: ~57.0.1
  expo-dev-client: ~57.0.10
  expo-font: ~57.0.1
  expo-linking: ~57.0.5
  expo-location: ~57.0.7
  expo-router: ~57.0.10
  expo-secure-store: ~57.0.1
  expo-splash-screen: ~57.0.5
  expo-status-bar: ~57.0.1
  expo-system-ui: ~57.0.2
  expo-web-browser: ~57.0.2
  "@expo/dom-webview": ~57.0.1
  "@expo/metro-runtime": ~57.0.8
  "@expo/vector-icons": ^15.1.1
  "@react-native-community/datetimepicker": 9.1.0
  "@react-native-community/slider": 5.2.0
  "@react-native-google-signin/google-signin": ^16.1.4

  # --- Next.js ---
  next: ^16.2.12
  next-intl: ^4.13.4
  next-themes: ^0.4.6
  "@next/bundle-analyzer": ^16.2.12
  "@next/third-parties": ^16.2.12
  "@t3-oss/env-nextjs": ^0.13.11

  # --- SEO ---
  schema-dts: ^2.0.0

  # --- Observability (Sentry) ---
  "@sentry/nextjs": ^10.69.0
  "@sentry/react-native": ~7.11.0

  # --- Tailwind / Styling ---
  # Both apps use Tailwind 4. The Expo app uses NativeWind 5 (preview), which is
  # built on Tailwind 4 + @tailwindcss/postcss and the react-native-css engine.
  tailwindcss: ^4.3.3
  nativewind: 5.0.0-preview.4
  react-native-css: ^3.0.7
  "@tailwindcss/postcss": ^4.3.3
  postcss: ^8.5.25
  tailwind-merge: ^3.6.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1

  # --- shadcn/ui (Radix) ---
  "@radix-ui/react-accordion": ^1.2.20
  "@radix-ui/react-alert-dialog": ^1.1.23
  "@radix-ui/react-avatar": ^1.2.6
  "@radix-ui/react-checkbox": ^1.3.11
  "@radix-ui/react-dropdown-menu": ^2.1.24
  "@radix-ui/react-label": ^2.1.15
  "@radix-ui/react-navigation-menu": ^1.2.22
  "@radix-ui/react-popover": ^1.1.23
  "@radix-ui/react-radio-group": ^1.4.7
  "@radix-ui/react-select": ^2.3.7
  "@radix-ui/react-separator": ^1.1.15
  "@radix-ui/react-slot": ^1.3.3
  "@radix-ui/react-switch": ^1.3.7
  "@radix-ui/react-tabs": ^1.1.21
  "@radix-ui/react-toggle": ^1.1.18
  "@radix-ui/react-toggle-group": ^1.1.19
  "@radix-ui/react-tooltip": ^1.2.16

  # --- Forms ---
  "@hookform/resolvers": ^5.7.1
  react-hook-form: ^7.84.0
  react-day-picker: ^10.0.1
  cmdk: ^1.1.1
  sonner: ^2.0.7

  # --- Date utilities ---
  date-fns: ^4.4.0
  date-fns-tz: ^3.2.0
  cronstrue: ^3.24.0

  # --- Icons ---
  lucide-react: ^1.28.0

  # --- Tooling ---
  # oxlint (Rust) replaces ESLint + typescript-eslint. Type-aware rules run via
  # oxlint-tsgolint, which has no TypeScript version cap — this is what lets the
  # repo run TypeScript 7.
  oxlint: ^1.77.0
  oxlint-tsgolint: ^7.0.2001
  prettier: ^3.9.6
  typescript: ^7.0.2
  turbo: ^2.10.8
  "@turbo/gen": ^2.10.8
  dotenv-cli: ^11.0.0
  lefthook: ^2.1.9
  minimatch: ^10.2.6
  tsx: ^4.22.4
  jiti: ^2.7.0

  # --- Prettier plugins ---
  "@ianvs/prettier-plugin-sort-imports": ^4.7.1
  prettier-plugin-tailwindcss: ^0.8.1

  # --- Type definitions ---
  # NOTE: @types/node stays on 22.x to match the Node 22 runtime (not 26.x).
  "@types/node": ^22.20.0
  "@types/nodemailer": ^8.0.1
  "@types/pg": ^8.20.0
  "@types/jsonwebtoken": ^9.0.10
  "@types/better-sqlite3": ^7.6.13
  "@types/estree": ^1.0.9
  "@types/json-schema": ^7.0.15
  "@types/babel__core": ^7.20.5

  # --- Babel (Expo) ---
  # NOTE: stays on Babel 7.x — Expo SDK 57 / Metro / babel-preset-expo require it.
  "@babel/core": ^7.29.0
  "@babel/preset-env": ^7.29.5
  "@babel/runtime": ^7.29.2

  # --- Dev utilities ---
  tw-animate-css: ^1.4.0

catalogs:
  react19:
    "@types/react": ^19.2.17
    "@types/react-dom": ^19.2.3

nodeLinker: hoisted

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.12"
  - "@expo/router-server@57.0.5"
  - "@expo/ui@57.0.9"
  - expo-constants@57.0.9
  - expo-linking@57.0.5
  - expo-modules-core@57.0.9
  - expo-router@57.0.10
  - expo@57.0.10
