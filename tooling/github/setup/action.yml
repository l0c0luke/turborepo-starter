name: "Setup and install"
description: "Common setup steps for Actions"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"

    # NOTE: turbo is a root devDependency and every script invokes it through
    # package.json, so the workspace install is all that's needed. Installing
    # it globally (`pnpm add -g turbo`) fails on the runner because pnpm's
    # global bin directory is not on PATH.
    - shell: bash
      run: pnpm install
